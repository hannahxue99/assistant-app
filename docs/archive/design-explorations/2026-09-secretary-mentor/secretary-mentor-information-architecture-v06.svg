<!-- Historical exploration archived 2026-09-22; see README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <rect width="900" height="900" fill="#F6F3EE"/>
  <text x="450" y="45" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="27" font-weight="650" fill="#2B2622">简单产品形态：三个地方，一个入口</text>
  <text x="450" y="75" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#8A837B">今天看当下，对话解决问题，记忆承接长期内容</text>

  <!-- Three surfaces -->
  <rect x="35" y="110" width="250" height="280" rx="20" fill="#FFFFFF" stroke="#E8E2D9" stroke-width="2"/>
  <rect x="35" y="110" width="250" height="48" rx="20" fill="#F9E8DD"/>
  <rect x="35" y="138" width="250" height="20" fill="#F9E8DD"/>
  <text x="58" y="141" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" font-weight="650" fill="#2B2622">今天</text>
  <text x="58" y="190" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2B2622">助手看到的近况</text>
  <text x="58" y="219" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">接下来要做的事</text>
  <text x="58" y="248" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">正在进行的三五条主线</text>
  <text x="58" y="277" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">长期待办只显示入口</text>
  <rect x="55" y="315" width="210" height="48" rx="14" fill="#FFFFFF" stroke="#8A837B"/>
  <text x="72" y="344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#8A837B">记一件事，或问问助手…</text>

  <rect x="325" y="110" width="250" height="280" rx="20" fill="#FFFFFF" stroke="#E8E2D9" stroke-width="2"/>
  <rect x="325" y="110" width="250" height="48" rx="20" fill="#F9E8DD"/>
  <rect x="325" y="138" width="250" height="20" fill="#F9E8DD"/>
  <text x="348" y="141" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" font-weight="650" fill="#2B2622">和助手说</text>
  <text x="348" y="190" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2B2622">只在需要时打开</text>
  <text x="348" y="219" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">秘书：办理并给回执</text>
  <text x="348" y="248" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">导师：依据近况逐步追问</text>
  <text x="348" y="277" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">聊清楚后回到今天</text>
  <rect x="345" y="315" width="210" height="48" rx="14" fill="#FFFFFF" stroke="#8A837B"/>
  <text x="362" y="344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#8A837B">继续说…</text>

  <rect x="615" y="110" width="250" height="280" rx="20" fill="#FFFFFF" stroke="#E8E2D9" stroke-width="2"/>
  <rect x="615" y="110" width="250" height="48" rx="20" fill="#F9E8DD"/>
  <rect x="615" y="138" width="250" height="20" fill="#F9E8DD"/>
  <text x="638" y="141" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" font-weight="650" fill="#2B2622">记忆</text>
  <text x="638" y="190" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2B2622">沉淀下来的长期内容</text>
  <text x="638" y="219" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">正在进行与历史轨迹</text>
  <text x="638" y="248" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">人物、目标、偏好和承诺</text>
  <text x="638" y="277" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">记录、主题、对话结论</text>
  <text x="638" y="306" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">用户确认过的经验与模式</text>
  <text x="638" y="344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#E0733A">所有理解均可查看和纠正</text>

  <!-- Input flow -->
  <text x="35" y="450" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2B2622">同一个输入框，回答形式明确不同</text>

  <rect x="35" y="475" width="830" height="62" rx="16" fill="#F9E8DD"/>
  <text x="65" y="514" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#2B2622">用户自然输入，不需要先选择“秘书”或“导师”</text>

  <path d="M180 537 L180 572" stroke="#C99A2E" stroke-width="3"/>
  <path d="M450 537 L450 572" stroke="#C99A2E" stroke-width="3"/>
  <path d="M720 537 L720 572" stroke="#C99A2E" stroke-width="3"/>

  <rect x="35" y="572" width="250" height="145" rx="16" fill="#FFFFFF" stroke="#E8E2D9"/>
  <text x="58" y="606" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="650" fill="#2B2622">普通记录</text>
  <text x="58" y="637" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">“客户想让首页更温暖”</text>
  <text x="58" y="670" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#E0733A">原文已保存</text>
  <text x="58" y="697" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#8A837B">不展开对话，保持三秒记录</text>

  <rect x="325" y="572" width="250" height="145" rx="16" fill="#FFFFFF" stroke="#E8E2D9"/>
  <text x="348" y="606" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="650" fill="#2B2622">明确事务</text>
  <text x="348" y="637" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">“明天下午提醒我发方案”</text>
  <text x="348" y="670" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#E0733A">已安排：明天 15:00</text>
  <text x="348" y="697" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#8A837B">结构化回执，可修改和撤销</text>

  <rect x="615" y="572" width="250" height="145" rx="16" fill="#FFFFFF" stroke="#E8E2D9"/>
  <text x="638" y="606" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="650" fill="#2B2622">问题或困惑</text>
  <text x="638" y="637" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">“最近为什么总觉得很乱？”</text>
  <text x="638" y="670" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#E0733A">打开短对话</text>
  <text x="638" y="697" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#8A837B">引用依据，一次只推进一个问题</text>

  <!-- Persisted content -->
  <text x="35" y="770" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="20" font-weight="650" fill="#2B2622">最终沉淀的不是全部聊天，而是有用的结果</text>
  <rect x="35" y="794" width="830" height="74" rx="16" fill="#FFFFFF" stroke="#E8E2D9"/>
  <text x="58" y="826" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">原声记录 · 待办与完成历史 · 项目主线与状态变化 · 人物与关系 · 目标与偏好</text>
  <text x="58" y="851" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#2B2622">用户确认过的决定、经验和模式 · 必要的对话历史与来源</text>
  <text x="450" y="892" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#8A837B">顶部导航建议：今天 · 记忆 · 我；对话页不占导航位置，从输入框临时进入</text>
</svg>
