<!-- Historical exploration archived 2026-09-22; see README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <rect width="1500" height="980" fill="#F6F3EE"/>

  <text x="750" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="30" font-weight="650" fill="#2B2622">一个入口，秘书帮你办，导师陪你想</text>
  <text x="750" y="92" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" fill="#8A837B">不需要切换角色；自然说话，系统选择最合适的回应方式</text>

  <!-- Screen 1 -->
  <g transform="translate(75,135)">
    <rect x="0" y="0" width="390" height="730" rx="42" fill="#2B2622"/>
    <rect x="10" y="10" width="370" height="710" rx="34" fill="#F6F3EE"/>
    <rect x="145" y="23" width="100" height="26" rx="13" fill="#2B2622"/>

    <text x="34" y="90" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#8A837B">9月9日 星期三</text>
    <text x="34" y="124" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24" font-weight="650" fill="#2B2622">今天</text>

    <rect x="24" y="148" width="342" height="118" rx="18" fill="#FFFFFF" stroke="#E8E2D9"/>
    <text x="42" y="180" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2B2622">我看到你最近主要在忙三件事</text>
    <text x="42" y="211" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#2B2622">发布页改版 · 明天交付</text>
    <text x="42" y="236" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#2B2622">体检安排 · 等待预约</text>
    <text x="42" y="261" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#E0733A">查看我的近况</text>

    <text x="28" y="312" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" font-weight="600" fill="#2B2622">接下来</text>
    <rect x="24" y="330" width="342" height="64" rx="14" fill="#F9E8DD"/>
    <circle cx="48" cy="362" r="10" fill="none" stroke="#E0733A" stroke-width="2"/>
    <text x="70" y="357" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#2B2622">明天 18:00</text>
    <text x="70" y="380" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#2B2622">提交三个视觉方向</text>

    <rect x="24" y="575" width="342" height="108" rx="18" fill="#FFFFFF" stroke="#8A837B"/>
    <text x="42" y="610" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#8A837B">告诉我一件事，或问问我最近怎么样…</text>
    <rect x="42" y="635" width="68" height="30" rx="15" fill="#F6F3EE"/>
    <text x="76" y="655" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#2B2622">记一下</text>
    <rect x="118" y="635" width="80" height="30" rx="15" fill="#F6F3EE"/>
    <text x="158" y="655" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#2B2622">帮我安排</text>
    <rect x="206" y="635" width="80" height="30" rx="15" fill="#F6F3EE"/>
    <text x="246" y="655" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#2B2622">陪我想想</text>
    <circle cx="333" cy="650" r="20" fill="#E0733A"/>
    <path d="M326 650 L340 650 M335 645 L340 650 L335 655" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="270" y="904" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2B2622">平时：看近况，也可以直接开口</text>
  <text x="270" y="934" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#8A837B">首页仍然简单，输入框永远在手边</text>

  <!-- Screen 2 -->
  <g transform="translate(555,135)">
    <rect x="0" y="0" width="390" height="730" rx="42" fill="#2B2622"/>
    <rect x="10" y="10" width="370" height="710" rx="34" fill="#F6F3EE"/>
    <rect x="145" y="23" width="100" height="26" rx="13" fill="#2B2622"/>

    <text x="34" y="92" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" font-weight="650" fill="#2B2622">和助手说</text>
    <text x="34" y="119" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#8A837B">秘书会直接处理清楚的事务</text>

    <rect x="76" y="150" width="290" height="70" rx="18" fill="#E0733A"/>
    <text x="94" y="179" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#FFFFFF">明天下午提醒我把三个方案</text>
    <text x="94" y="202" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#FFFFFF">发给小王</text>

    <rect x="24" y="244" width="320" height="178" rx="18" fill="#FFFFFF" stroke="#E8E2D9"/>
    <text x="44" y="278" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2B2622">已经帮你安排好了</text>
    <text x="44" y="313" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#8A837B">时间</text>
    <text x="108" y="313" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#2B2622">明天 15:00</text>
    <text x="44" y="344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#8A837B">事项</text>
    <text x="108" y="344" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#2B2622">把三个方案发给小王</text>
    <line x1="44" y1="365" x2="324" y2="365" stroke="#E8E2D9"/>
    <rect x="44" y="379" width="78" height="30" rx="15" fill="#F9E8DD"/>
    <text x="83" y="399" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#E0733A">修改时间</text>
    <rect x="132" y="379" width="54" height="30" rx="15" fill="#F6F3EE"/>
    <text x="159" y="399" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#2B2622">撤销</text>

    <text x="36" y="475" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#8A837B">处理完成后，结果会回到首页待办里。</text>

    <rect x="24" y="615" width="342" height="58" rx="18" fill="#FFFFFF" stroke="#8A837B"/>
    <text x="42" y="650" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#8A837B">继续说…</text>
    <circle cx="333" cy="644" r="20" fill="#E0733A"/>
    <path d="M326 644 L340 644 M335 639 L340 644 L335 649" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="750" y="904" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2B2622">秘书：说完就办，给你清楚回执</text>
  <text x="750" y="934" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#8A837B">明确、可修改、可撤销，不拉长对话</text>

  <!-- Screen 3 -->
  <g transform="translate(1035,135)">
    <rect x="0" y="0" width="390" height="730" rx="42" fill="#2B2622"/>
    <rect x="10" y="10" width="370" height="710" rx="34" fill="#F6F3EE"/>
    <rect x="145" y="23" width="100" height="26" rx="13" fill="#2B2622"/>

    <text x="34" y="92" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" font-weight="650" fill="#2B2622">一起想想</text>
    <text x="34" y="119" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#8A837B">导师先理解，再问一个真正有用的问题</text>

    <rect x="104" y="150" width="262" height="52" rx="18" fill="#E0733A"/>
    <text x="122" y="182" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#FFFFFF">最近为什么总觉得很乱？</text>

    <rect x="24" y="226" width="320" height="240" rx="18" fill="#FFFFFF" stroke="#E8E2D9"/>
    <text x="44" y="260" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2B2622">我先说说我看到的</text>
    <text x="44" y="294" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#2B2622">这周你同时推进三个主题，</text>
    <text x="44" y="319" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#2B2622">其中两个都在明后天交付。</text>
    <text x="44" y="350" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#8A837B">依据：近 7 天的 8 条记录和 3 个待办</text>
    <line x1="44" y1="372" x2="324" y2="372" stroke="#E8E2D9"/>
    <text x="44" y="402" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#2B2622">你现在更接近哪一种？</text>
    <rect x="44" y="419" width="110" height="32" rx="16" fill="#F9E8DD"/>
    <text x="99" y="440" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#E0733A">事情真的太多</text>
    <rect x="164" y="419" width="150" height="32" rx="16" fill="#F6F3EE"/>
    <text x="239" y="440" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" fill="#2B2622">还没决定先做什么</text>

    <text x="36" y="516" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#8A837B">它不会立刻给一大段建议，</text>
    <text x="36" y="539" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" fill="#8A837B">而是依据你的近况，陪你把问题聊清楚。</text>

    <rect x="24" y="615" width="342" height="58" rx="18" fill="#FFFFFF" stroke="#8A837B"/>
    <text x="42" y="650" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#8A837B">回答它，或者继续说…</text>
    <circle cx="333" cy="644" r="20" fill="#E0733A"/>
    <path d="M326 644 L340 644 M335 639 L340 644 L335 649" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="1230" y="904" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#2B2622">导师：引用近况，只问一个关键问题</text>
  <text x="1230" y="934" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#8A837B">不说教，不假装懂你，不一次输出长篇答案</text>
</svg>
