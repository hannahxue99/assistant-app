<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="960" viewBox="0 0 1260 960">
  <rect width="1260" height="960" fill="#ECE8E1"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #2B2622; }
    .muted { fill: #8A837B; }
    .accent { fill: #E0733A; }
    .inverse { fill: #FFFFFF; }
    .undo { fill: #F3B28E; }
    .card { fill: #FFFFFF; stroke: #E8E2D9; stroke-width: 1; }
    .soft { fill: #F9E8DD; }
    .phone { fill: #F6F3EE; stroke: #D8D1C7; stroke-width: 2; }
    .rule { stroke: #E8E2D9; stroke-width: 1; }
  </style>

  <text x="30" y="42" font-size="24" font-weight="700">长期记忆关键状态</text>

  <g transform="translate(24,68)">
    <rect width="380" height="830" rx="30" class="phone"/>
    <text x="24" y="54" font-size="24" font-weight="700">我的</text>
    <text x="24" y="98" font-size="19" font-weight="650">长期记忆</text>
    <text x="24" y="122" font-size="12" class="muted">卡片内修改，不打开新页面</text>
    <rect x="18" y="145" width="344" height="210" rx="16" class="card"/>
    <rect x="34" y="163" width="52" height="25" rx="12.5" class="soft"/>
    <text x="60" y="180" font-size="12" text-anchor="middle" class="accent">偏好</text>
    <rect x="34" y="202" width="312" height="78" rx="12" fill="#F6F3EE" stroke="#E0733A" stroke-width="2"/>
    <text x="48" y="231" font-size="15">不喜欢安排早会，重要事项尽量</text>
    <text x="48" y="256" font-size="15">放在下午。</text>
    <text x="34" y="305" font-size="12" class="muted">保存后建立新版本，旧内容可撤销恢复</text>
    <text x="246" y="335" font-size="14" class="muted">取消</text>
    <rect x="292" y="311" width="54" height="34" rx="17" fill="#E0733A"/>
    <text x="319" y="333" font-size="14" text-anchor="middle" fill="#FFFFFF">保存</text>
    <text x="190" y="800" font-size="13" text-anchor="middle" class="muted">状态 A · 原地修改</text>
  </g>

  <g transform="translate(440,68)">
    <rect width="380" height="830" rx="30" class="phone"/>
    <text x="24" y="54" font-size="24" font-weight="700">我的</text>
    <text x="24" y="98" font-size="19" font-weight="650">长期记忆</text>
    <text x="24" y="122" font-size="12" class="muted">只展示已经生效的记忆</text>
    <rect x="18" y="145" width="344" height="170" rx="16" class="card"/>
    <circle cx="190" cy="190" r="21" class="soft"/>
    <text x="190" y="197" font-size="20" text-anchor="middle" class="accent">✦</text>
    <text x="190" y="235" font-size="16" text-anchor="middle">还没有长期记忆</text>
    <text x="190" y="263" font-size="13" text-anchor="middle" class="muted">可以直接告诉小知：</text>
    <text x="190" y="286" font-size="13" text-anchor="middle" class="muted">“记住，我不喜欢安排早会”</text>
    <text x="24" y="365" font-size="13" class="muted">助手与同步</text>
    <rect x="18" y="383" width="344" height="118" rx="16" class="card"/>
    <text x="34" y="426" font-size="16">理解引擎</text>
    <text x="344" y="426" font-size="13" text-anchor="end" class="muted">已开启  ›</text>
    <line x1="34" y1="448" x2="346" y2="448" class="rule"/>
    <text x="34" y="484" font-size="16">同步到苹果日历</text>
    <text x="190" y="800" font-size="13" text-anchor="middle" class="muted">状态 B · 空记忆</text>
  </g>

  <g transform="translate(856,68)">
    <rect width="380" height="830" rx="30" class="phone"/>
    <text x="24" y="54" font-size="24" font-weight="700">我的</text>
    <text x="24" y="98" font-size="19" font-weight="650">长期记忆</text>
    <rect x="18" y="128" width="344" height="120" rx="16" class="card"/>
    <rect x="34" y="146" width="76" height="25" rx="12.5" class="soft"/>
    <text x="72" y="163" font-size="12" text-anchor="middle" class="accent">长期目标</text>
    <text x="34" y="202" font-size="15">建立长期陪伴型私人 AI。</text>
    <text x="264" y="231" font-size="13" class="muted">修改　 忘记</text>

    <rect x="30" y="660" width="320" height="58" rx="16" fill="#2B2622"/>
    <text x="52" y="695" font-size="14" class="inverse">已忘记“不喜欢安排早会”</text>
    <text x="322" y="695" font-size="14" text-anchor="end" class="undo">撤销</text>
    <text x="190" y="800" font-size="13" text-anchor="middle" class="muted">状态 C · 忘记后可撤销</text>
  </g>

  <text x="630" y="934" font-size="13" text-anchor="middle" class="muted">加载：首次使用 3 张骨架卡；刷新：保留现有内容；失败：记忆区内显示“暂时加载不了 · 重试”，下方设置仍可使用</text>
</svg>
