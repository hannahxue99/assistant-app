<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <style>
      .bg { fill: #F6F2EA; }
      .panel { fill: #FFFFFF; stroke: #E4DED4; stroke-width: 2; }
      .title { fill: #27231F; font: 700 34px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .h2 { fill: #27231F; font: 650 24px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .body { fill: #4E4841; font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .small { fill: #827A71; font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .label { fill: #746C63; font: 600 15px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; letter-spacing: 1px; }
      .active { fill: #2D2925; font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .inactive { fill: #9A9289; font: 500 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .flow { fill: #FFF8EF; stroke: #E9B785; stroke-width: 2; }
      .ok { fill: #EAF5EC; stroke: #87B890; stroke-width: 2; }
      .bad { fill: #FFF0ED; stroke: #D99C90; stroke-width: 2; }
      .arrow { stroke: #A89E93; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .guide { stroke: #E26F4B; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A89E93"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="1200" rx="28"/>
  <text x="54" y="62" class="title">跳链切换与事件卡底部留白修正</text>
  <text x="54" y="96" class="small">v1.5 · 只修状态归属与卡片高度，不改变数据和业务规则</text>

  <rect x="54" y="130" width="1092" height="420" rx="24" class="panel"/>
  <text x="84" y="176" class="label">问题 1 · 小知跳链后无法切回本周待办</text>
  <text x="84" y="215" class="h2">跳链参数只消费一次，之后由用户的点击决定页面状态</text>

  <rect x="84" y="257" width="180" height="78" rx="16" class="flow"/>
  <text x="174" y="290" text-anchor="middle" class="body">小知回执</text>
  <text x="174" y="316" text-anchor="middle" class="small">进入全部待办</text>
  <path d="M 264 296 L 336 296" class="arrow"/>
  <rect x="338" y="257" width="224" height="78" rx="16" class="flow"/>
  <text x="450" y="290" text-anchor="middle" class="body">首次读取跳链参数</text>
  <text x="450" y="316" text-anchor="middle" class="small">定位并高亮目标</text>
  <path d="M 562 296 L 634 296" class="arrow"/>
  <rect x="636" y="257" width="180" height="78" rx="16" class="flow"/>
  <text x="726" y="290" text-anchor="middle" class="body">全部待办</text>
  <text x="726" y="316" text-anchor="middle" class="small">当前页</text>
  <path d="M 816 296 L 888 296" class="arrow"/>
  <rect x="890" y="257" width="226" height="78" rx="16" class="ok"/>
  <text x="1003" y="290" text-anchor="middle" class="body">点击“本周待办”</text>
  <text x="1003" y="316" text-anchor="middle" class="small">保持本周，不被拉回</text>

  <rect x="84" y="378" width="1032" height="126" rx="18" fill="#FAF8F4" stroke="#E9E3D9" stroke-width="2"/>
  <text x="112" y="414" class="small">切换后的首页</text>
  <text x="112" y="456" class="active">本周待办</text>
  <text x="224" y="456" class="small">｜</text>
  <text x="245" y="456" class="inactive">全部待办</text>
  <text x="965" y="456" class="small">手动选择生效 ✓</text>
  <text x="112" y="486" class="small">新的小知回执仍可再次定位；旧参数不会持续控制 Tab。</text>

  <rect x="54" y="580" width="1092" height="548" rx="24" class="panel"/>
  <text x="84" y="626" class="label">问题 2 · 事件卡底部空间过大</text>
  <text x="84" y="665" class="h2">去掉固定最小高度，让标题、进展、时间三行自然撑开</text>

  <text x="84" y="720" class="small">修改前 · 固定高度 102px</text>
  <rect x="84" y="742" width="470" height="190" rx="18" class="bad"/>
  <text x="108" y="780" class="h2">房贷还款安排</text>
  <text x="108" y="814" class="body">下个月 11 号还款 10 万</text>
  <text x="108" y="845" class="small">今天 12:43</text>
  <line x1="96" y1="866" x2="542" y2="866" class="guide"/>
  <rect x="96" y="867" width="446" height="53" rx="8" fill="#F6D8D2" opacity="0.8"/>
  <text x="319" y="900" text-anchor="middle" class="small">固定高度留下的空白</text>

  <text x="646" y="720" class="small">修改后 · 内容自然高度约 86–90px</text>
  <rect x="646" y="742" width="470" height="148" rx="18" class="ok"/>
  <text x="670" y="780" class="h2">房贷还款安排</text>
  <text x="670" y="814" class="body">下个月 11 号还款 10 万</text>
  <text x="670" y="845" class="small">今天 12:43</text>
  <text x="881" y="922" text-anchor="middle" class="small">上下内边距一致，卡片底部不再多一截</text>

  <rect x="84" y="974" width="1032" height="104" rx="18" fill="#FAF8F4" stroke="#E9E3D9" stroke-width="2"/>
  <text x="110" y="1012" class="body">保持不变</text>
  <text x="244" y="1012" class="small">标题 / 当前进展 / 最新时间三行；右上置顶按钮与 44px 点击热区；排序和跳转逻辑。</text>
  <text x="110" y="1049" class="body">本次不改</text>
  <text x="244" y="1049" class="small">待办范围、数据库结构、小知生成逻辑、事件内容。</text>
</svg>
