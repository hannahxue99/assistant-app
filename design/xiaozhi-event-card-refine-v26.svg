<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2B2622" flood-opacity=".07"/></filter>
    <style>.bg{fill:#F6F3EE}.card{fill:#FFF;stroke:#E8E2D9}.ink{fill:#2B2622;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.dim{fill:#8A837B;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.orange{fill:#E0733A}.eye{fill:#FFF7F2}.line{stroke:#E8E2D9}</style>
  </defs>
  <rect width="800" height="800" class="bg"/>
  <text x="48" y="60" class="ink" font-size="28" font-weight="700">小知位置与首页事件字号</text>
  <text x="48" y="93" class="dim" font-size="14">只调整两个视觉值，不改变组件高度和卡片间距。</text>

  <g transform="translate(48 130)">
    <rect width="704" height="230" rx="22" class="card" filter="url(#s)"/>
    <text x="24" y="38" class="ink" font-size="17" font-weight="700">小知选中态</text>
    <text x="24" y="66" class="dim" font-size="13">38pt 保持不变，从上移 3pt 调整为上移 5pt。</text>
    <line x1="24" y1="92" x2="680" y2="92" class="line"/>
    <g transform="translate(310 105)">
      <rect x="2" y="0" width="76" height="76" rx="38" class="orange"/>
      <ellipse cx="31" cy="34" rx="6.5" ry="9.5" class="eye"/>
      <ellipse cx="55" cy="34" rx="6.5" ry="9.5" class="eye"/>
      <text x="40" y="108" class="orange" font-size="14" font-weight="700" text-anchor="middle">小知</text>
    </g>
    <text x="505" y="151" class="dim" font-size="13">↑ 再上移 2pt</text>
  </g>

  <g transform="translate(48 400)">
    <rect width="704" height="300" rx="22" class="card" filter="url(#s)"/>
    <text x="24" y="38" class="ink" font-size="17" font-weight="700">首页事件卡片</text>
    <text x="24" y="66" class="dim" font-size="13">第二行由 13pt / 19pt 调整为 14pt / 20pt。</text>
    <g transform="translate(46 102)">
      <rect width="612" height="150" rx="14" class="card"/>
      <text x="18" y="34" class="ink" font-size="17" font-weight="700">公积金贷款还款</text>
      <text x="18" y="69" class="ink" font-size="14">已还款 30 万，计划下个月继续提前还款</text>
      <text x="18" y="100" class="dim" font-size="11">今天 12:43</text>
      <g transform="translate(554 13)"><circle cx="16" cy="16" r="10" fill="none" stroke="#E0733A" stroke-width="2"/><path d="M16 7v18M8 16h16" stroke="#E0733A" stroke-width="2"/></g>
    </g>
    <text x="352" y="282" class="dim" font-size="13" text-anchor="middle">标题和时间不变，仅增强当前状态的可读性</text>
  </g>
</svg>
