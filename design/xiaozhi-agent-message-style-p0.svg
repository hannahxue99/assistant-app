  <text x="122" y="109" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#FFFFFF">Muse 是什么？最近有什么动态？</text>
  <text x="332" y="132" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#FAD7C4">19:42</text>

  <g transform="translate(20 177)">
    <g stroke="#5577F2" stroke-width="1.8" fill="none">
      <ellipse cx="10" cy="10" rx="9" ry="3.8" transform="rotate(45 10 10)"/>
      <ellipse cx="10" cy="10" rx="9" ry="3.8" transform="rotate(-45 10 10)"/>
      <circle cx="10" cy="10" r="1.7" fill="#5577F2" stroke="none"/>
    </g>
    <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#68636A">已思考（用时 3 秒）</text>
    <text x="181" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#68636A">›</text>
  </g>

  <g transform="translate(20 215)">
