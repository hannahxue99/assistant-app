    <path d="M2.5 10h15M10 2c3 3.5 3 12.5 0 16M10 2c-3 3.5-3 12.5 0 16" stroke="#5577F2" stroke-width="1.2" fill="none"/>
    <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#68636A">搜索来源 4</text>
    <text x="116" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#68636A">›</text>
  </g>

  <text x="20" y="281" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#2B2622">
    <tspan x="20" dy="0">Muse 通常指英国摇滚乐队 Muse。</tspan>
    <tspan x="20" dy="25">他们以宏大的现场编曲、电子元素和</tspan>
    <tspan x="20" dy="25">Matt Bellamy 的高音唱腔著称。</tspan>
  </text>

  <g transform="translate(20 382)">
    <g stroke="#5577F2" stroke-width="1.8" fill="none">
      <ellipse cx="10" cy="10" rx="9" ry="3.8" transform="rotate(45 10 10)"/>
      <ellipse cx="10" cy="10" rx="9" ry="3.8" transform="rotate(-45 10 10)"/>
      <circle cx="10" cy="10" r="1.7" fill="#5577F2" stroke="none"/>
    </g>
    <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#68636A">已思考（用时 2 秒）</text>
    <text x="181" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#68636A">›</text>
  </g>
  <text x="20" y="438" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#2B2622">
    <tspan x="20" dy="0">如果你说的是另一款叫 Muse 的产品，</tspan>
    <tspan x="20" dy="25">告诉我它出现在哪里，我可以继续确认。</tspan>
  </text>

  <line x1="20" y1="508" x2="370" y2="508" stroke="#E8E2D9"/>
  <text x="20" y="548" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#8A837B">交互规则</text>
  <text x="20" y="581" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#68636A">
    <tspan x="20" dy="0">• 用户内容：保留品牌色气泡</tspan>
    <tspan x="20" dy="25">• 助手正文：无底色、无边框、直接排版</tspan>
    <tspan x="20" dy="25">• 过程与来源：图标 + 文字 + 紧邻箭头</tspan>
    <tspan x="20" dy="25">• 展开详情：缩进文本，不嵌套卡片</tspan>
