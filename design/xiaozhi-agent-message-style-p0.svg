<svg xmlns="http://www.w3.org/2000/svg" width="390" height="760" viewBox="0 0 390 760">
  <rect width="390" height="760" fill="#FDFCFB"/>
  <text x="20" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#2B2622">小知</text>

