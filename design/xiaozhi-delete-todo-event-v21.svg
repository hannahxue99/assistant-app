<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2B2622" flood-opacity="0.08"/></filter>
    <style>
      .bg{fill:#F6F3EE}.card{fill:#FFF;stroke:#E8E2D9;stroke-width:1}.soft{fill:#F9E8DD}.warn{fill:#FFF2EC;stroke:#E9A17D;stroke-width:1}.ink{fill:#2B2622;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.dim{fill:#8A837B;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.accent{fill:#E0733A;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.line{stroke:#BDB5AB;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#BDB5AB"/></marker>
  </defs>
  <rect width="1000" height="1200" class="bg"/>
  <text x="55" y="65" class="ink" font-size="30" font-weight="700">小知删除待办与事件</text>
  <text x="55" y="99" class="dim" font-size="15">键盘与语音共用一条链路：明确请求 → 唯一匹配 → 原子删除 → 回执撤销。</text>

  <g transform="translate(55 140)">
    <rect width="430" height="545" rx="24" class="card" filter="url(#shadow)"/>
    <text x="28" y="46" class="ink" font-size="21" font-weight="700">删除待办</text>
    <rect x="28" y="72" width="374" height="62" rx="15" class="soft"/>
    <text x="48" y="99" class="ink" font-size="15">用户：“删除下周还款 10 万的待办”</text>
    <text x="48" y="121" class="dim" font-size="12">语音先转文字，与键盘输入相同</text>
    <path d="M215 134 L215 165" class="line"/>
    <rect x="58" y="168" width="314" height="64" rx="14" class="card"/>
    <text x="215" y="195" class="ink" font-size="15" text-anchor="middle">模型匹配唯一待办 ID</text>
    <text x="215" y="217" class="dim" font-size="12" text-anchor="middle">多个同名候选 → 先追问，不删除</text>
    <path d="M215 232 L215 263" class="line"/>
    <rect x="58" y="266" width="314" height="96" rx="14" class="warn"/>
    <text x="215" y="292" class="ink" font-size="15" text-anchor="middle">同一事务删除一条待办实体</text>
    <text x="215" y="318" class="dim" font-size="12" text-anchor="middle">首页消失 · 事件详情同步消失</text>
    <text x="215" y="341" class="dim" font-size="12" text-anchor="middle">苹果日历进入删除补偿队列</text>
    <path d="M215 362 L215 393" class="line"/>
    <rect x="58" y="396" width="314" height="78" rx="14" class="card"/>
    <text x="215" y="425" class="ink" font-size="15" text-anchor="middle">回执：“删除待办：还款 10 万”</text>
    <text x="215" y="450" class="accent" font-size="13" font-weight="700" text-anchor="middle">撤销</text>
    <text x="28" y="514" class="dim" font-size="13">不是删除两份：事件里展示的就是同一条待办。</text>
  </g>

  <g transform="translate(515 140)">
    <rect width="430" height="545" rx="24" class="card" filter="url(#shadow)"/>
    <text x="28" y="46" class="ink" font-size="21" font-weight="700">删除事件</text>
    <rect x="28" y="72" width="374" height="62" rx="15" class="soft"/>
    <text x="48" y="99" class="ink" font-size="15">用户：“删除贷款这个事件”</text>
    <text x="48" y="121" class="dim" font-size="12">唯一匹配到“公积金贷款”</text>
    <path d="M215 134 L215 161" class="line"/>
    <polygon points="215,164 330,218 215,272 100,218" fill="#FFF" stroke="#E8E2D9"/>
    <text x="215" y="214" class="ink" font-size="15" text-anchor="middle">存在关联待办？</text>
    <text x="215" y="235" class="dim" font-size="12" text-anchor="middle">且用户未说明去留</text>
    <path d="M100 218 L48 218 L48 300" class="line"/>
    <text x="62" y="203" class="dim" font-size="12">没有</text>
    <path d="M330 218 L382 218 L382 300" class="line"/>
    <text x="350" y="203" class="dim" font-size="12">有</text>
    <rect x="20" y="303" width="150" height="82" rx="14" class="card"/>
    <text x="95" y="333" class="ink" font-size="14" text-anchor="middle">直接删除事件</text>
    <text x="95" y="358" class="dim" font-size="12" text-anchor="middle">不追加确认</text>
    <rect x="260" y="303" width="150" height="82" rx="14" class="warn"/>
    <text x="335" y="328" class="ink" font-size="14" text-anchor="middle">小知先询问</text>
    <text x="335" y="351" class="dim" font-size="12" text-anchor="middle">“2 条关联待办</text>
    <text x="335" y="369" class="dim" font-size="12" text-anchor="middle">要一起删除吗？”</text>
    <path d="M335 385 L335 416" class="line"/>
    <rect x="194" y="419" width="216" height="72" rx="14" class="card"/>
    <text x="302" y="446" class="ink" font-size="14" text-anchor="middle">保留 → 只删事件</text>
    <text x="302" y="470" class="ink" font-size="14" text-anchor="middle">一起删 → 事件 + 全部关联待办</text>
    <text x="28" y="514" class="dim" font-size="13">用户未回答：保持原状，不生成任何删除操作。</text>
  </g>

  <g transform="translate(55 725)">
    <rect width="890" height="410" rx="24" class="card" filter="url(#shadow)"/>
    <text x="28" y="47" class="ink" font-size="21" font-weight="700">提交与撤销边界</text>

    <rect x="28" y="75" width="250" height="112" rx="16" class="soft"/>
    <text x="153" y="105" class="ink" font-size="15" text-anchor="middle">模型只提出候选操作</text>
    <text x="153" y="133" class="dim" font-size="12" text-anchor="middle">delete_todo / delete_event</text>
    <text x="153" y="158" class="dim" font-size="12" text-anchor="middle">只能引用本轮候选 ID</text>
    <path d="M278 131 L335 131" class="line"/>

    <rect x="338" y="75" width="250" height="112" rx="16" class="warn"/>
    <text x="463" y="105" class="ink" font-size="15" text-anchor="middle">本地校验 + 单事务</text>
    <text x="463" y="133" class="dim" font-size="12" text-anchor="middle">版本冲突整轮回滚</text>
    <text x="463" y="158" class="dim" font-size="12" text-anchor="middle">不允许删除一半</text>
    <path d="M588 131 L645 131" class="line"/>

    <rect x="648" y="75" width="214" height="112" rx="16" class="card"/>
    <text x="755" y="105" class="ink" font-size="15" text-anchor="middle">回执 + 撤销</text>
    <text x="755" y="133" class="dim" font-size="12" text-anchor="middle">按快照恢复实体、关系</text>
    <text x="755" y="158" class="dim" font-size="12" text-anchor="middle">及苹果日历同步</text>

    <text x="28" y="235" class="ink" font-size="17" font-weight="700">保留什么</text>
    <circle cx="37" cy="270" r="4" fill="#E0733A"/><text x="54" y="275" class="ink" font-size="14">原始对话消息始终保留；删除对象不等于篡改聊天历史。</text>
    <circle cx="37" cy="306" r="4" fill="#E0733A"/><text x="54" y="311" class="ink" font-size="14">删除事件先进入后台关闭态，从首页、搜索和详情入口隐藏，供撤销使用。</text>
    <circle cx="37" cy="342" r="4" fill="#E0733A"/><text x="54" y="347" class="ink" font-size="14">删除待办保存快照与关联关系；撤销后恢复到首页和原事件。</text>
    <circle cx="37" cy="378" r="4" fill="#E0733A"/><text x="54" y="383" class="ink" font-size="14">明确说“事件删掉，待办保留 / 一起删”时不重复询问。</text>
  </g>
</svg>
