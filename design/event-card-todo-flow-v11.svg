  <rect x="62" y="735" width="195" height="54" rx="13" class="card"/><text x="83" y="767" class="body">点击小知待办回执</text>
  <path d="M258 762 H328" class="arrow"/><rect x="333" y="735" width="165" height="54" rx="13" class="card"/><text x="382" y="767" class="body">回到首页</text>
  <rect x="555" y="735" width="195" height="54" rx="13" class="card"/><text x="576" y="767" class="body">点击小知事件回执</text>
  <path d="M751 762 H821" class="arrow"/><rect x="826" y="735" width="180" height="54" rx="13" class="card"/><text x="856" y="767" class="body">进入事件详情</text>
