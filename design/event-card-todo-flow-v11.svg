<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#392B22" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg{fill:#F6F2EC}.panel{fill:#FFFCF8;stroke:#DDD4CA;stroke-width:1.5}.card{fill:#FFFFFF;stroke:#E6DED5;stroke-width:1.4}.pin{fill:#FFF4E8;stroke:#E87532;stroke-width:1.5}.label{font:600 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#9B6E51}.title{font:700 22px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#2D251F}.h2{font:700 17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#2D251F}.body{font:400 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4D433C}.muted{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#9A9189}.note{font:500 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#6D625A}.accent{fill:#E87532}.line{stroke:#D6CCC2;stroke-width:1.4;fill:none}.arrow{stroke:#E87532;stroke-width:2;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#E87532"/></marker>
