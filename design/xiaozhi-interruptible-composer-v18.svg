<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <style>
      .bg { fill: #f6f3ee; }
      .panel { fill: #fff; stroke: #e8e2d9; stroke-width: 2; }
      .bubble-user { fill: #e0733a; }
      .bubble-ai { fill: #fff; stroke: #e8e2d9; stroke-width: 1.5; }
      .ink { fill: #2b2622; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .dim { fill: #8a837b; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .accent { fill: #e0733a; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .white { fill: #fff; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .arrow { stroke: #c9c0b6; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c9c0b6"/></marker>
  </defs>
  <rect class="bg" width="1200" height="820"/>
  <text x="70" y="68" class="ink" font-size="30" font-weight="700">小知：可输入、可中止的执行状态</text>
  <text x="70" y="103" class="dim" font-size="17">模型运行不再锁死输入框；停止按钮真正终止请求，而不是只隐藏动画</text>

  <rect x="70" y="145" width="320" height="520" rx="28" class="panel"/>
  <rect x="440" y="145" width="320" height="520" rx="28" class="panel"/>
  <rect x="810" y="145" width="320" height="520" rx="28" class="panel"/>

  <text x="100" y="190" class="dim" font-size="13">01 · 空闲</text>
  <text x="470" y="190" class="accent" font-size="13">02 · 小知执行中</text>
  <text x="840" y="190" class="dim" font-size="13">03 · 用户点击停止</text>

  <rect x="118" y="235" width="240" height="72" rx="18" class="bubble-user"/>
  <text x="138" y="267" class="white" font-size="14">帮我规划下个月还款</text>
  <text x="335" y="292" class="white" font-size="11" text-anchor="end" opacity="0.75">18:20</text>

  <rect x="488" y="235" width="240" height="72" rx="18" class="bubble-user"/>
  <text x="508" y="267" class="white" font-size="14">帮我规划下个月还款</text>
  <text x="705" y="292" class="white" font-size="11" text-anchor="end" opacity="0.75">18:20</text>
  <rect x="470" y="326" width="232" height="96" rx="18" class="bubble-ai"/>
  <text x="490" y="357" class="ink" font-size="14">我先帮你梳理还款节奏，</text>
  <text x="490" y="382" class="ink" font-size="14">目前需要先确认…</text>
  <text x="490" y="407" class="accent" font-size="12">小知正在处理 ▋</text>

  <rect x="858" y="235" width="240" height="72" rx="18" class="bubble-user"/>
  <text x="878" y="267" class="white" font-size="14">帮我规划下个月还款</text>
  <text x="1075" y="292" class="white" font-size="11" text-anchor="end" opacity="0.75">18:20</text>
  <rect x="840" y="326" width="244" height="112" rx="18" class="bubble-ai"/>
  <text x="860" y="357" class="ink" font-size="14">我先帮你梳理还款节奏，</text>
  <text x="860" y="382" class="ink" font-size="14">目前需要先确认…</text>
  <text x="860" y="414" class="dim" font-size="12">已停止 · 未执行任何操作</text>

  <rect x="94" y="565" width="272" height="54" rx="27" class="bubble-ai"/>
  <circle cx="123" cy="592" r="19" fill="#f9e8dd"/>
  <text x="123" y="599" class="accent" font-size="19" text-anchor="middle">⌕</text>
  <text x="151" y="598" class="dim" font-size="14">发消息给小知</text>
  <circle cx="337" cy="592" r="19" fill="#d8d2cc"/>
  <path d="M337 599 v-13 M332 591 l5-5 5 5" fill="none" stroke="#fff" stroke-width="2"/>

  <rect x="464" y="565" width="272" height="54" rx="27" class="bubble-ai"/>
  <circle cx="493" cy="592" r="19" fill="#f1ede8"/>
  <text x="493" y="599" class="dim" font-size="18" text-anchor="middle">⌕</text>
  <text x="521" y="598" class="ink" font-size="14">另外，下月 11 号…</text>
  <circle cx="707" cy="592" r="19" fill="#e0733a"/>
  <rect x="701" y="586" width="12" height="12" rx="2" fill="#fff"/>

  <rect x="834" y="565" width="272" height="54" rx="27" class="bubble-ai"/>
  <circle cx="863" cy="592" r="19" fill="#f9e8dd"/>
  <text x="863" y="599" class="accent" font-size="19" text-anchor="middle">⌕</text>
  <text x="891" y="598" class="ink" font-size="14">另外，下月 11 号…</text>
  <circle cx="1077" cy="592" r="19" fill="#e0733a"/>
  <path d="M1077 599 v-13 M1072 591 l5-5 5 5" fill="none" stroke="#fff" stroke-width="2"/>

  <path d="M392 405 C415 405 415 405 438 405" class="arrow"/>
  <path d="M762 405 C785 405 785 405 808 405" class="arrow"/>

  <text x="70" y="728" class="ink" font-size="18" font-weight="700">关键规则</text>
  <text x="70" y="762" class="dim" font-size="15">执行中：可以输入草稿，但不能发送第二条；右侧方块用于停止。完成或停止后，草稿原样保留，按钮恢复为发送。</text>
  <text x="70" y="790" class="dim" font-size="15">停止后：保留已经显示的半截回复并标注“已停止”；未完成的待办、事件、记忆与事件增量全部不落库。</text>
</svg>
