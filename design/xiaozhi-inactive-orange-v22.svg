<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#2B2622" flood-opacity="0.08"/></filter>
    <style>
      .bg{fill:#F6F3EE}.card{fill:#FFF;stroke:#E8E2D9;stroke-width:1}.ink{fill:#2B2622;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.dim{fill:#8A837B;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.orange{fill:#E0733A}.soft{fill:#F9E8DD}.eye{fill:#FFF7F2}.line{stroke:#E8E2D9;stroke-width:1}
    </style>
  </defs>
  <rect width="1000" height="520" class="bg"/>
  <text x="55" y="64" class="ink" font-size="30" font-weight="700">小知未选中态：脸保持品牌橙</text>
  <text x="55" y="98" class="dim" font-size="15">选中与否只通过大小和上移区分，不再通过脸部颜色区分。</text>

  <g transform="translate(55 142)">
    <rect width="420" height="300" rx="22" class="card" filter="url(#shadow)"/>
    <text x="24" y="38" class="dim" font-size="14">现在 · 未选中</text>
    <line x1="24" y1="62" x2="396" y2="62" class="line"/>
    <g transform="translate(170 102)">
      <rect x="0" y="0" width="80" height="80" rx="40" class="soft"/>
      <ellipse cx="29" cy="35" rx="7" ry="10" class="orange"/>
      <ellipse cx="51" cy="35" rx="7" ry="10" class="orange"/>
      <text x="40" y="116" class="dim" font-size="16" text-anchor="middle">视觉像灰色</text>
    </g>
  </g>

  <g transform="translate(525 142)">
    <rect width="420" height="300" rx="22" class="card" filter="url(#shadow)"/>
    <text x="24" y="38" class="dim" font-size="14">修改后 · 未选中</text>
    <line x1="24" y1="62" x2="396" y2="62" class="line"/>
    <g transform="translate(170 102)">
      <rect x="0" y="0" width="80" height="80" rx="40" class="orange"/>
      <ellipse cx="29" cy="35" rx="7" ry="10" class="eye"/>
      <ellipse cx="51" cy="35" rx="7" ry="10" class="eye"/>
      <text x="40" y="116" class="ink" font-size="16" text-anchor="middle">品牌橙 #E0733A</text>
    </g>
  </g>
</svg>
