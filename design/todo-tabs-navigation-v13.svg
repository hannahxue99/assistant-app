<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#392B22" flood-opacity="0.10"/></filter>
    <style>
      .bg{fill:#F6F2EC}.panel{fill:#FFFCF8;stroke:#DDD4CA;stroke-width:1.5}.card{fill:#FFFFFF;stroke:#E6DED5;stroke-width:1.4}.focus{fill:#FFF7ED;stroke:#E0733A;stroke-width:2}.label{font:600 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#9B6E51}.title{font:700 23px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#2D251F}.tabMain{font:700 20px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.tabMinor{font:600 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.active{fill:#2D251F}.inactive{fill:#A49B93}.body{font:400 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#4D433C}.muted{font:400 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#9A9189}.note{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#6D625A}.arrow{stroke:#E0733A;stroke-width:2;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#E0733A"/></marker>
  </defs>
  <rect width="1200" height="1200" class="bg"/>
  <text x="45" y="55" class="title">首页待办双 Tab 与小知精准跳转</text>

  <rect x="45" y="90" width="510" height="730" rx="26" class="panel" filter="url(#shadow)"/>
  <text x="75" y="130" class="label">默认状态 · 本周待办</text>
  <text x="75" y="183" class="tabMain active">本周待办</text>
  <text x="180" y="182" class="muted">｜</text>
  <text x="203" y="183" class="tabMinor inactive">全部待办</text>
  <rect x="75" y="193" width="80" height="3" rx="1.5" fill="#E0733A"/>
  <text x="75" y="236" class="label">今天 9/15 周二</text>
  <rect x="74" y="252" width="452" height="68" rx="13" class="card"/>
  <circle cx="101" cy="286" r="10" fill="#FFF" stroke="#8A837B" stroke-width="2"/>
  <text x="126" y="291" class="body">吃个苹果</text><text x="439" y="291" class="muted">全天</text>
  <text x="75" y="360" class="label">9/18 周五</text>
  <rect x="74" y="375" width="452" height="68" rx="13" class="focus"/>
  <circle cx="101" cy="409" r="10" fill="#FFF" stroke="#E0733A" stroke-width="2"/>
  <text x="126" y="414" class="body">提交项目材料</text><text x="439" y="414" class="muted">10:00</text>
  <text x="75" y="477" class="muted">只显示今天起7天窗口内的待办</text>
  <text x="75" y="547" class="tabMain active">事件</text>
  <rect x="74" y="570" width="452" height="118" rx="15" class="card"/>
  <text x="94" y="603" class="tabMain active">公积金贷款还款</text>
  <text x="94" y="641" class="body">已还30万，剩余约30多万</text>
  <text x="94" y="670" class="muted">更新于 今天 16:15</text>

  <rect x="645" y="90" width="510" height="730" rx="26" class="panel" filter="url(#shadow)"/>
  <text x="675" y="130" class="label">切换状态 · 全部待办</text>
  <text x="675" y="183" class="tabMain inactive">本周待办</text>
  <text x="780" y="182" class="muted">｜</text>
  <text x="803" y="183" class="tabMinor active">全部待办</text>
  <rect x="803" y="193" width="62" height="3" rx="1.5" fill="#E0733A"/>
  <text x="675" y="236" class="label">10/11 周日</text>
  <rect x="674" y="252" width="452" height="64" rx="13" class="focus"/>
  <circle cx="700" cy="284" r="10" fill="#FFF" stroke="#E0733A" stroke-width="2"/><text x="725" y="289" class="body">还款10万</text><text x="1040" y="289" class="muted">全天</text>
  <text x="675" y="355" class="label">11/02 周一</text>
  <rect x="674" y="371" width="452" height="64" rx="13" class="card"/>
  <circle cx="700" cy="403" r="10" fill="#FFF" stroke="#8A837B" stroke-width="2"/><text x="725" y="408" class="body">办理车辆续保</text><text x="1040" y="408" class="muted">全天</text>
  <text x="675" y="481" class="muted">只显示7天窗口之后的待办，不重复本周事项</text>
  <text x="675" y="511" class="muted">无日期待办仍隐藏</text>
  <text x="675" y="716" class="muted">同一首页模块切换；事件区在列表之后</text>

  <rect x="45" y="865" width="1110" height="240" rx="22" fill="#FFF9F2" stroke="#E8D4C2" stroke-width="1.4"/>
  <text x="75" y="905" class="label">小知回执跳转规则</text>
  <rect x="75" y="940" width="220" height="60" rx="14" class="card"/><text x="102" y="976" class="body">日期在今天起7天内</text>
  <path d="M297 970 H372" class="arrow"/><rect x="377" y="940" width="230" height="60" rx="14" class="card"/><text x="397" y="965" class="body">首页 · 选中本周待办</text><text x="426" y="986" class="muted">定位并高亮该条</text>
  <rect x="75" y="1025" width="220" height="60" rx="14" class="card"/><text x="112" y="1061" class="body">日期在7天窗口后</text>
  <path d="M297 1055 H372" class="arrow"/><rect x="377" y="1025" width="230" height="60" rx="14" class="card"/><text x="397" y="1050" class="body">首页 · 选中全部待办</text><text x="426" y="1071" class="muted">定位并高亮该条</text>
  <rect x="745" y="940" width="205" height="60" rx="14" class="card"/><text x="776" y="976" class="body">点击小知事件回执</text>
  <path d="M952 970 H1010" class="arrow"/><rect x="1015" y="940" width="115" height="60" rx="14" class="card"/><text x="1026" y="976" class="body">事件详情</text>
</svg>
